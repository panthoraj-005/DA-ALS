[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "__pycache__", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "ARG", "SIM", "RUF"]
ignore = [
  "E501",    # line length is handled by the formatter
  "B008",    # FastAPI's Depends()/File()/Form() defaults are the documented idiom
  "RUF001",  # typographic punctuation in user-facing strings is deliberate
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "E402", "SIM117"]
"models.py" = ["N801"]        # EMG_CNN matches the notebook's class name exactly
"smoke_test.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
