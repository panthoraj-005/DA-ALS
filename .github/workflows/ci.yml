name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # CPU wheels first: the default PyPI torch pulls the CUDA runtime,
          # which is ~2 GB of download the runner has no GPU to use.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Tests
        working-directory: backend
        # Demo weights: these assert the service behaves, not that the model is
        # accurate — accuracy belongs to the trained artifacts, which are not
        # in the repository.
        env:
          DEMO_MODE: '1'
          ENABLE_FLORENCE: '0'
          ENABLE_LLM: '0'
          SERVE_FRONTEND: '0'
        run: pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # `npm run build` is `tsc -b && vite build`, so this fails on any type error.
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
